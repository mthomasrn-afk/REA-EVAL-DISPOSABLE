name: REA C5 joint exact Job and shared owner sample - SYNTHETIC ONLY
on:
  push:
    branches:
      - experiment/rea-c5-joint-exact-job-20261115
    paths:
      - screening/rea-c5-native-evidence/joint_extras.py
      - screening/owner-qualification/exact_job_witness.py
      - .github/workflows/rea-c5-joint-exact-job.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: rea-c5-joint-exact-${{ github.ref }}
  cancel-in-progress: false
jobs:
  independently-attested-timepoint:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.19.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Reuse previously built source-pinned original-owner candidate
        uses: actions/download-artifact@v4
        with:
          name: rea-c5-test-only-native-addon
          run-id: 43788378442
          repository: mthomasrn-afk/REA-EVAL-DISPOSABLE
          github-token: ${{ github.token }}
          path: output
      - name: Original source and new joint witness synthetic check
        shell: pwsh
        run: |
          python -B -m py_compile screening/owner-qualification/exact_job_witness.py screening/rea-c5-native-evidence/joint_extras.py
          python -B screening/rea-c5-native-evidence/joint_extras.py output/rea-windows-x64.node output/manifest.json output/PATCH_RECEIPT.json "$env:RUNNER_TEMP/REA_C5_JOINT_RESULT.json"
      - name: Preserve actual positive or negative observation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rea-c5-joint-${{ matrix.os }}-NOT-ORIGINAL-C5
          path: ${{ runner.temp }}/REA_C5_JOINT_RESULT.json
          retention-days: 3
          if-no-files-found: warn
