name: PROJ-0071 REA mandatory live-agent claim gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/proj0071-rea-integrated-gate.yml'
      - 'screening/integrated/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p71-rea-mandatory-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actual-gated-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout public synthetic harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare pinned Node 24.15.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.15.0'
      - name: Prepare Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Validate syntax, dependencies and original deterministic validator
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile screening/integrated/live-agent-mandatory-gate.py screening/integrated/model-free-preflight.py
          node --check screening/integrated/mandatory-rea-gate.mjs
          node screening/claim-validator/test-semantic-claim-validator.mjs
          python -m pip install --disable-pip-version-check 'langgraph==1.2.15'
          npm install --ignore-scripts --no-audit --no-fund --no-save --package-lock=false rea-agents@6.5.0
          python -c "import importlib.metadata as m; assert m.version('langgraph')=='1.2.15'; print('LANGGRAPH_EXACT_PASS')"
          node -e "if(require('rea-agents/package.json').version!=='6.5.0')process.exit(1);console.log('REA_EXACT_PASS')"
          python -m pip freeze | LC_ALL=C sort | sha256sum
      - name: Preflight real REA MCP and mandatory gate, no model
        shell: bash
        run: |
          set -euo pipefail
          python -u screening/integrated/model-free-preflight.py
      - name: Start bounded digest-pinned local Qwen3 Ollama
        shell: bash
        run: |
          set -euo pipefail
          docker pull 'ollama/ollama@sha256:926d40fd6eeeebd346b5c358a63de2a10ec995371cd93dd22f1843200694b1a6'
          docker run -d --name p71-gated-local-model --cpus=3 --memory=8g --pids-limit=512 \
            -e OLLAMA_NUM_PARALLEL=1 -e OLLAMA_KEEP_ALIVE=30m \
            -p 127.0.0.1:11434:11434 \
            'ollama/ollama@sha256:926d40fd6eeeebd346b5c358a63de2a10ec995371cd93dd22f1843200694b1a6'
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          docker exec p71-gated-local-model ollama pull qwen3:1.7b
          docker exec p71-gated-local-model ollama list | grep -E 'qwen3:1.7b[[:space:]]+8f68893c685c'
      - name: End-to-end LangGraph to real MCP to mandatory consumer gate
        shell: bash
        run: |
          set -euo pipefail
          python -u screening/integrated/live-agent-mandatory-gate.py
      - name: Stop disposable model container
        if: always()
        shell: bash
        run: |
          docker stop p71-gated-local-model || true
