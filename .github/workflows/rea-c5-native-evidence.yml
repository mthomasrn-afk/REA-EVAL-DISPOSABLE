name: REA C5 original-owner evidence candidate — synthetic qualification only
on:
  push:
    branches:
      - candidate/rea-c5-native-evidence-010-20261115
    paths:
      - screening/rea-c5-native-evidence/**
      - .github/workflows/rea-c5-native-evidence.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rea-c5-evidence-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pinned-source-build-and-negative-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.19.0'
      - name: Negative evidence validator controls, no native owner yet
        shell: bash
        run: python -m unittest discover -s screening/rea-c5-native-evidence -p 'test_*.py' -v
      - name: Original upstream pinned source and isolated candidate two-file overlay
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch rea-agents-6.5.0 https://github.com/morluto/rea.git candidate-upstream
          test "$(git -C candidate-upstream rev-parse HEAD)" = 3b79af28e80785afce9f5998d8f03289402a1847
          python -B screening/rea-c5-native-evidence/apply_candidate.py candidate-upstream output/PATCH_RECEIPT.json
      - name: Windows x64 native cross-build using original script
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -qq update
          sudo apt-get -qq install -y --no-install-recommends g++-mingw-w64-x86-64
          node candidate-upstream/scripts/build-windows-native.mjs
          cp candidate-upstream/native/windows/build/rea-windows-x64.node output/
          cp candidate-upstream/native/windows/build/manifest.json output/
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          d=Path('output')
          m=json.loads((d/'manifest.json').read_text())
          a=(d/'rea-windows-x64.node').read_bytes()
          assert m['packageVersion']=='6.5.0'
          assert m['artifactSha256']==hashlib.sha256(a).hexdigest()
          print('C5_CANDIDATE_NATIVE_SHA256',m['artifactSha256'])
          PY
      - name: Upload test-only native candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rea-c5-test-only-native-addon
          path: output/
          retention-days: 3
          if-no-files-found: error
  independent-windows:
    needs: pinned-source-build-and-negative-gates
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.19.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: rea-c5-test-only-native-addon
          path: output
      - name: Original lifecycle controls plus independent telemetry challenge
        shell: pwsh
        run: |
          python -B screening/rea-c5-native-evidence/verify_native_ci.py --addon output/rea-windows-x64.node --manifest output/manifest.json --patch-receipt output/PATCH_RECEIPT.json --output "$env:RUNNER_TEMP/REA_C5_CANDIDATE_RESULT.json"
      - name: Preserve real results including failure or incomplete
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rea-c5-evidence-${{ matrix.os }}-NOT-REA-QUALIFICATION
          path: ${{ runner.temp }}/REA_C5_CANDIDATE_RESULT.json
          retention-days: 3
          if-no-files-found: warn
