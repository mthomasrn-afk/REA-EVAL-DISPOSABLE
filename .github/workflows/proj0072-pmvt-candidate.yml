name: PROJ-0072 PMVT synthetic candidate tests
on:
  push:
    branches: [candidate/proj0072-pmvt-v010-20261115]
    paths:
      - 'pmvt_candidate/**'
      - '.github/workflows/proj0072-pmvt-candidate.yml'
permissions:
  contents: read
concurrency:
  group: pmvt-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pmvt-candidate-source-and-native-self-observation:
    name: 'PMVT v0.1 synthetic / ${{ matrix.os }}'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - name: Checkout disposable synthetic-only branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Python 3.11 from existing Factory CI pattern
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Dependency-free structural, adverse and native self-PID controls
        run: python -B -m unittest discover -s pmvt_candidate -p test_pmvt.py -v
      - name: Confirm no owner journal can self-qualify REA C5
        run: python -B -c "import sys;sys.path.insert(0,'pmvt_candidate');from test_pmvt import sample;from pmvt import validate_owner_journal; assert validate_owner_journal(sample())['rea_c5']=='INDETERMINATE'"
