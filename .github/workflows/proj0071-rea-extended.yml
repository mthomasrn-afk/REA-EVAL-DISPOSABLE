name: PROJ-0071 REA extended candidate acceptance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/proj0071-rea-extended.yml'
      - 'screening/agent-campaign/extended-p71-campaign.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p71-rea-extended-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extended-candidate-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout only public synthetic harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Node 24.15.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.15.0'
      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install exact direct dependencies and capture graph digests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'langgraph==1.2.15' 'inspect-ai==0.3.263'
          npm install --ignore-scripts --no-audit --no-fund --no-save --package-lock=false rea-agents@6.5.0
          python -c "import importlib.metadata as m; assert m.version('langgraph')=='1.2.15'; assert m.version('inspect-ai')=='0.3.263'; print('EXACT_PYTHON_DIRECT_VERSIONS_PASS')"
          node -e "const p=require('rea-agents/package.json'); if(p.version!=='6.5.0')process.exit(1);console.log('EXACT_REA_DIRECT_VERSION_PASS')"
          python -m pip freeze | LC_ALL=C sort > "$RUNNER_TEMP/p71-pip-freeze.txt"
          npm ls --all --json > "$RUNNER_TEMP/p71-npm-tree.json"
          sha256sum "$RUNNER_TEMP/p71-pip-freeze.txt" "$RUNNER_TEMP/p71-npm-tree.json"
      - name: Start digest-pinned Ollama local server
        shell: bash
        run: |
          set -euo pipefail
          docker pull 'ollama/ollama@sha256:926d40fd6eeeebd346b5c358a63de2a10ec995371cd93dd22f1843200694b1a6'
          docker run -d --name p71-rea-formal-ollama --cpus=3 --memory=8g --pids-limit=512 \
            -e OLLAMA_NUM_PARALLEL=1 -e OLLAMA_KEEP_ALIVE=30m \
            -p 127.0.0.1:11434:11434 \
            'ollama/ollama@sha256:926d40fd6eeeebd346b5c358a63de2a10ec995371cd93dd22f1843200694b1a6'
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          docker exec p71-rea-formal-ollama ollama pull qwen3:1.7b
          docker exec p71-rea-formal-ollama ollama list
          docker exec p71-rea-formal-ollama ollama list | grep -E 'qwen3:1.7b[[:space:]]+8f68893c685c'
      - name: Execute bounded PROJ-0071 candidate campaign with Inspect Score types
        shell: bash
        run: |
          set -euo pipefail
          python -u screening/agent-campaign/extended-p71-campaign.py
      - name: Stop the owned local-model container
        if: always()
        shell: bash
        run: |
          docker stop p71-rea-formal-ollama || true
