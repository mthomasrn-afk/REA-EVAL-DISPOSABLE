name: REA C5 original R5-style Toolhelp versus exact owner Job synthetic discriminator
on:
  push:
    branches:
      - experiment/rea-c5-topology-vs-job-20261115
    paths:
      - screening/rea-c5-native-evidence/cmd_tree_actor.mjs
      - screening/rea-c5-native-evidence/cmd_tree_test.py
      - screening/rea-c5-native-evidence/independent_toolhelp.py
      - .github/workflows/rea-c5-topology-vs-job.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: rea-c5-topology-vs-job-${{ github.ref }}
  cancel-in-progress: false
jobs:
  cmd-outer-job-synthetic:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.19.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Reuse pinned original-owner test-only native artifact
        uses: actions/download-artifact@v4
        with:
          name: rea-c5-test-only-native-addon
          run-id: 43788378442
          repository: mthomasrn-afk/REA-EVAL-DISPOSABLE
          github-token: ${{ github.token }}
          path: output
      - name: Synthetic CMD / Python four-role hierarchy under REA owner
        shell: pwsh
        run: |
          python -B -m py_compile screening/rea-c5-native-evidence/cmd_tree_test.py
          python -B screening/rea-c5-native-evidence/cmd_tree_test.py output/rea-windows-x64.node output/manifest.json output/PATCH_RECEIPT.json "$env:RUNNER_TEMP/REA_CMD_TREE_RESULT.json"
      - name: Save original positive or negative bounded receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rea-c5-topology-vs-job-${{ matrix.os }}-NOT-ORIGINAL-R5
          path: ${{ runner.temp }}/REA_CMD_TREE_RESULT.json
          retention-days: 3
          if-no-files-found: warn
